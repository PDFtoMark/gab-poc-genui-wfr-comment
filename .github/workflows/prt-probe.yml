name: prt-probe
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "CONTENT: $(cat probe.txt 2>/dev/null)"
